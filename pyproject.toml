[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cds"
version = "0.1.0"
description = "Concept Definition Stage — a docs-as-code RDF vocabulary + facilitation model for SEBoK Concept Definition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Zargham", email = "michael.zargham@gmail.com" }]
keywords = ["systems-engineering", "sebok", "incose", "sysml-v2", "rdf", "skos", "mbse"]
dependencies = [
  # core/model — local-first hard deps (see plan: Coupling)
  "rdflib>=7.0",
  "pyshacl>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# render/View layer needs Typst + Pandoc binaries too (not Python deps)
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.scripts]
cds = "cds.core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cds"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
