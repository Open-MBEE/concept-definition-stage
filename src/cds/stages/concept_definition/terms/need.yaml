# Verbatim INCOSE GtWR v4 (summary sheet, reproduction-with-attribution). The load-bearing NRM
# distinction: a need is an agreed-to EXPECTATION (contrast a requirement = an agreed-to OBLIGATION).
definition: "A need statement is the result of a formal transformation of one or more sources or lifecycle concepts into an agreed-to expectation for an entity to perform some function or possess some quality within specified constraints with acceptable risk."
