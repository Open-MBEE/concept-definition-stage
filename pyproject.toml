[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cds"
version = "0.1.0"
description = "Concept Definition Stage — a docs-as-code RDF vocabulary + facilitation model for SEBoK Concept Definition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Michael Zargham", email = "michael.zargham@gmail.com" }]
maintainers = [{ name = "cds contributors" }]
keywords = ["systems-engineering", "sebok", "incose", "sysml-v2", "rdf", "skos", "mbse"]
dependencies = [
  # core/model — local-first hard deps (see plan: Coupling)
  "rdflib>=7.0",
  "pyshacl>=0.27",
  "pydantic>=2.7",
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# render/View layer needs Typst + Pandoc binaries too (not Python deps)
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6"]
# Scientific-Python docs stack (NumFOCUS/OpenMBEE norm): Sphinx + MyST + pydata theme + autodoc.
docs = [
  "sphinx>=7.2",
  "myst-parser>=2.0",
  "pydata-sphinx-theme>=0.15",
  "linkify-it-py>=2.0",
]
# live SysML v2 service interop (roadmap T9); requires Starforge credentials in .env
interop = [
  "sysmlv2-python-client @ git+https://github.com/Open-MBEE/sysmlv2-python-client",
  "requests>=2.31",
]

mcp = ["mcp>=1.0"]
facilitator = ["cds[mcp]", "anthropic>=0.40", "instructor>=1.0"]
selfhosted-llm = ["vllm>=0.6", "xgrammar>=0.1"]
app = ["cds[facilitator]", "voila>=0.5", "ipywidgets>=8", "jupyterhub>=5", "dockerspawner>=13", "oauthenticator>=17"]
store = ["pyoxigraph>=0.4", "oxrdflib>=0.4"]

[project.scripts]
cds = "cds.core.cli:main"
cds-mcp = "cds.mcp.server:main"
cds-serve = "cds.facilitator.server:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cds"]
# Ship the read-only canon + vendored scaffolding assets inside the wheel (TOOL_ROOT). Editable
# installs use the source tree directly; these globs make a future wheel carry the same canon.
artifacts = [
  "src/cds/ontology/**/*.ttl",
  "src/cds/stages/concept_definition/terms/*.yaml",
  "src/cds/stages/concept_definition/characteristics.yaml",
  "src/cds/assets/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
