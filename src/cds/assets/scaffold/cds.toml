# CDS project marker.
#
# This file makes its directory a CDS *data root*: `cds` reads/writes your concept-definition
# mapping (RDF instances + compiled briefs) under here — in YOUR repo, never in the CDS install.
# Resolution: `cds` searches upward from the working directory for this file (or honors $CDS_PROJECT).

[project]
name = "{name}"

[layout]
# Where authored RDF instances accumulate, and where deterministic briefs are compiled.
instances = "concept-definition/instances"
briefs = "concept-definition/briefs"
