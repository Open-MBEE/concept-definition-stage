# cds web app — self-hosted single-tenant composition (spec §6.2, N1/N2).
# Trust boundary tightens downward: traefik (TLS, WS passthrough) → jupyterhub (OIDC) →
# per-user cds-app containers (spawned by the hub via the docker socket; hardened in
# jupyterhub_config.py). Secrets come from the environment / an operator secrets file —
# NEVER committed here.

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${CDS_ACME_EMAIL:?set operator email}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm", "--proxy-headers", "xforwarded", "--http-enabled", "true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CDS_KC_ADMIN:?set keycloak admin user}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CDS_KC_ADMIN_PASSWORD:?set keycloak admin password}
      KC_HOSTNAME: https://${CDS_AUTH_HOST:?set auth hostname}
    volumes:
      - ./keycloak/realm-dsg.json:/opt/keycloak/data/import/realm-dsg.json:ro
      - keycloak-data:/opt/keycloak/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.keycloak.rule: Host(`${CDS_AUTH_HOST}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.certresolver: le
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    restart: unless-stopped

  jupyterhub:
    build:
      context: .
      dockerfile: images/hub/Dockerfile
    environment:
      CDS_APP_HOST: ${CDS_APP_HOST:?set app hostname}
      CDS_AUTH_HOST: ${CDS_AUTH_HOST}
      CDS_OAUTH_CLIENT_SECRET: ${CDS_OAUTH_CLIENT_SECRET:?set oauth client secret}
      DOCKER_NOTEBOOK_IMAGE: cds-app:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - hub-data:/srv/jupyterhub/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.hub.rule: Host(`${CDS_APP_HOST}`)
      traefik.http.routers.hub.entrypoints: websecure
      traefik.http.routers.hub.tls.certresolver: le
      traefik.http.services.hub.loadbalancer.server.port: "8000"
    restart: unless-stopped
    # note: no `ports:` — the hub is reachable only through traefik (WS passthrough is
    # native; traefik proxies the kernel websocket upgrade untouched)

volumes:
  letsencrypt:
  keycloak-data:
  hub-data:
