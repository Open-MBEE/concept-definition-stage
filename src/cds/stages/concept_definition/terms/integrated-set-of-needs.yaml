slug: integrated-set-of-needs
pref_label: Integrated Set of Needs
# Verbatim INCOSE GtWR v4 (summary sheet). The well-formed output set of needs — the deliverable of
# the Concept Definition stage. GtWR defines it as the "need set". (The v0.2 cds:Synthesis is the
# actual synthesized instance; this is the vocabulary concept.) No SEBoK glossary entry exists, so it
# is grounded by broadMatch to the broader SEBoK Stakeholder Needs and Requirements concept.
definition: "A need set is a structured set of agreed-to need expressions for the entity (enterprise/business unit/system/subsystem/system element/process) and its external interfaces. Within the NRM, GtNR, GtVV, and this Guide this set of needs is referred to as an Integrated Set of Needs. This Integrated Set of Needs is well-formed, having the characteristics defined in this Guide, communicating the scope of effort to which the system of interest will be validated against."
grounding:
  - relation: broad-match
    target: https://sebokwiki.org/wiki/Stakeholder_Needs_and_Requirements_(glossary)
cites:
